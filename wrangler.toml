name = "atproto-worker"
main = "src/index.js"
compatibility_date = "2025-07-18"
# websocket_hibernation is enabled by default since 2024-04-03;
# the explicit flag name was removed in newer runtimes.

# Cron for interaction sync + journal refresh.
# 15 min: interaction sync is log-only (ADR-015), journal refresh picks up
# asset changes, and the firehose broadcast cursor lives in the DO.
[triggers]
crons = ["*/15 * * * *"]

# Static assets: journal.ndjson is deployed with the Worker.
# JOURNAL_URL points back to this Worker's own /journal.ndjson,
# so the whole setup is self-contained (no external static hosting).
[assets]
directory = "./public"
binding = "ASSETS"

# Durable Object for WebSocket subscriptions
[[durable_objects.bindings]]
name = "FIREHOSE"
class_name = "Firehose"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Firehose"]

[vars]
# 本文件不含任何身份配置 —— 一键部署后 Worker 从部署域名自动推导身份：
#   OWNER_DID    = "did:web:<你的域名>"
#   OWNER_HANDLE = "<你的域名>"
# 公钥完全自发现：本地 `node cli/seal.js init` 生成 public/.well-known/did.json
# （含公钥）随 Worker 部署；发布账号的公钥经各自域名的 well-known 获取。
# 无需任何环境变量或 secret。

# Note: PRIVATE_KEY is only used by the local CLI (cli/seal.js), not by the Worker.
# It lives in config.json locally and must NEVER be committed or deployed as an env var.

# Development overrides
[env.dev.vars]
# Local dev identity (dev-only, derived from "localhost" otherwise)
OWNER_DID = "did:web:localhost"
OWNER_HANDLE = "localhost"
# Local dev journal is loaded from file via JOURNAL_CONTENT (npm run dev:local)
